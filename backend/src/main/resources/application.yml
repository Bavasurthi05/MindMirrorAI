server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mental_health_db?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # Data exports can be large; the social import parser applies its own, tighter limits.
      max-file-size: ${SOCIAL_IMPORT_MAX_UPLOAD:100MB}
      max-request-size: ${SOCIAL_IMPORT_MAX_REQUEST:101MB}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  api:
    version: v1
    base-path: /api/${app.api.version}
  ml:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:8000}
    retry-backoff-ms: ${ML_RETRY_BACKOFF_MS:250}
    circuit-breaker:
      failure-threshold: ${ML_CB_FAILURE_THRESHOLD:5}
      open-seconds: ${ML_CB_OPEN_SECONDS:30}
    training:
      # Guards the ML service's train/promote endpoints — they change what every user sees.
      token: ${ML_TRAINING_TOKEN:}
      request-timeout-ms: ${ML_TRAINING_TIMEOUT_MS:120000}
      # Salt for pseudonymizing exported rows. Set a real value in production.
      hash-salt: ${ML_TRAINING_HASH_SALT:mindmirror-local-salt}
      max-per-user: ${ML_TRAINING_MAX_PER_USER:200}
      # Weekly run that stops at the gate; promotion always stays a human decision.
      scheduled-enabled: ${ML_TRAINING_SCHEDULED:false}
      cron: ${ML_TRAINING_CRON:0 0 3 * * SUN}
  social-import:
    # Most recent posts analyzed per upload; bounds ML cost and time for large archives.
    max-posts: ${SOCIAL_IMPORT_MAX_POSTS:1000}
    min-text-length: ${SOCIAL_IMPORT_MIN_TEXT_LENGTH:15}
    max-upload-bytes: ${SOCIAL_IMPORT_MAX_UPLOAD_BYTES:104857600}
    # Largest single posts file read out of an archive.
    max-file-bytes: ${SOCIAL_IMPORT_MAX_FILE_BYTES:52428800}
    # Total bytes inflated across an archive; the guard against zip bombs.
    max-inflated-bytes: ${SOCIAL_IMPORT_MAX_INFLATED_BYTES:1073741824}
  baseline:
    cron: ${BASELINE_CRON:0 30 2 * * *}
  analysis:
    # Journal analysis writes mood/trigger entries so analytics reflects ordinary use.
    derive-mood-entries: ${ANALYSIS_DERIVE_MOOD:true}
    derive-trigger-entries: ${ANALYSIS_DERIVE_TRIGGERS:true}
    max-attempts: ${ANALYSIS_MAX_ATTEMPTS:3}
    retry-interval-ms: ${ANALYSIS_RETRY_INTERVAL_MS:120000}
    retry-initial-delay-ms: ${ANALYSIS_RETRY_INITIAL_DELAY_MS:60000}
    retry-batch-size: ${ANALYSIS_RETRY_BATCH_SIZE:25}

management:
  endpoints:
    web:
      exposure:
        include: health, info
